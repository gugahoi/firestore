name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2

    - name: Install Syft
      id: syft
      uses: anchore/sbom-action/download-syft@v0

    - name: Add Syft to PATH
      run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"

    - name: Generate Homebrew tap token
      id: tap-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
        private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
        owner: gugahoi
        repositories: homebrew-tap

    - name: Release
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean --fail-fast
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attest release artifacts
      uses: actions/attest@v4
      with:
        subject-checksums: dist/checksums.txt

    - name: Update Homebrew cask
      env:
        TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        git clone "https://x-access-token:${TAP_TOKEN}@github.com/gugahoi/homebrew-tap.git" homebrew-tap
        ./scripts/write-cask.sh "${TAG}" dist/checksums.txt homebrew-tap/Casks/firestore.rb
        git -C homebrew-tap config user.name "github-actions[bot]"
        git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C homebrew-tap add Casks/firestore.rb
        if git -C homebrew-tap diff --cached --quiet; then
          echo "Homebrew cask is already up to date."
        else
          git -C homebrew-tap commit -m "Update firestore cask to ${TAG}"
          git -C homebrew-tap push
        fi
