name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2

    - name: Install Syft
      id: syft
      uses: anchore/sbom-action/download-syft@v0

    - name: Add Syft to PATH
      run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"

    - name: Generate Homebrew tap token
      id: tap-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
        private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
        owner: gugahoi
        repositories: homebrew-tap

    - name: Release
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean --fail-fast
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attest release artifacts
      uses: actions/attest@v4
      with:
        subject-checksums: dist/checksums.txt

    # GoReleaser's cask template lags Homebrew's cops (e.g. `# No zap stanza required`,
    # goreleaser#7253), so autocorrect before publishing; fails on uncorrectable offenses.
    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@main

    - name: Fix Homebrew cask style
      run: brew style --fix dist/homebrew/Casks/firestore.rb

    - name: Check out tap
      uses: actions/checkout@v6
      with:
        repository: gugahoi/homebrew-tap
        token: ${{ steps.tap-token.outputs.token }}
        path: homebrew-tap

    - name: Publish cask
      working-directory: homebrew-tap
      run: |
        cp ../dist/homebrew/Casks/firestore.rb Casks/firestore.rb
        git config user.name goreleaserbot
        git config user.email bot@goreleaser.com
        git add Casks/firestore.rb
        git commit -m "Brew cask update for firestore version $GITHUB_REF_NAME"
        git push
