name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Test
      run: go test ./...

    - name: Check GoReleaser config
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: '~> v2'
        args: check
